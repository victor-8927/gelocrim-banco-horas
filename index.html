<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Horas — Gelo Manaus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #f0f2f5;
  --bg-card: #ffffff;
  --bg-header: #0a0f1a;
  --bg-section: #f8f9fb;
  --fg: #111827;
  --fg-muted: #6b7280;
  --fg-light: #9ca3af;
  --border: #e5e7eb;
  --accent: #2563eb;
  --accent-light: #eff6ff;
  --green: #16a34a;
  --green-light: #f0fdf4;
  --amber: #d97706;
  --amber-light: #fffbeb;
  --red: #dc2626;
  --red-light: #fef2f2;
  --orange: #ea580c;
  --orange-light: #fff7ed;
  --purple: #7c3aed;
  --purple-light: #f5f3ff;
  --teal: #0891b2;
  --teal-light: #ecfeff;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.05);
  --radius: 12px;
  --radius-sm: 7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117;
    --bg-card: #161b22;
    --bg-header: #010409;
    --bg-section: #0d1117;
    --fg: #e6edf3;
    --fg-muted: #8b949e;
    --fg-light: #6e7681;
    --border: #21262d;
    --accent: #58a6ff;
    --accent-light: #0d2149;
    --green: #3fb950;
    --green-light: #0d2318;
    --amber: #d29922;
    --amber-light: #2d2000;
    --red: #f85149;
    --red-light: #2d0f0f;
    --orange: #f0883e;
    --orange-light: #2d1500;
    --purple: #bc8cff;
    --purple-light: #1e0a3c;
    --teal: #39c5cf;
    --teal-light: #001f29;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117;
  --bg-card: #161b22;
  --bg-header: #010409;
  --bg-section: #0d1117;
  --fg: #e6edf3;
  --fg-muted: #8b949e;
  --fg-light: #6e7681;
  --border: #21262d;
  --accent: #58a6ff;
  --accent-light: #0d2149;
  --green: #3fb950;
  --green-light: #0d2318;
  --amber: #d29922;
  --amber-light: #2d2000;
  --red: #f85149;
  --red-light: #2d0f0f;
  --orange: #f0883e;
  --orange-light: #2d1500;
  --purple: #bc8cff;
  --purple-light: #1e0a3c;
  --teal: #39c5cf;
  --teal-light: #001f29;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,.4);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Header ── */
.header {
  background: var(--bg-header);
  color: #fff;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.header-brand { display: flex; align-items: center; gap: 12px; }
.header-logo {
  width: 36px; height: 36px;
  background: #2563eb;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.header-title { font-size: 16px; font-weight: 700; letter-spacing: -.2px; }
.header-sub { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.header-date {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  color: rgba(255,255,255,.7);
  font-variant-numeric: tabular-nums;
}
.theme-btn {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  color: rgba(255,255,255,.7);
  cursor: pointer;
  transition: background .15s;
}
.theme-btn:hover { background: rgba(255,255,255,.15); }
.refresh-btn {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  color: rgba(255,255,255,.7);
  cursor: pointer;
  transition: background .15s;
  display: flex; align-items: center; gap: 5px;
}
.refresh-btn:hover { background: rgba(255,255,255,.15); }
.refresh-btn.loading { opacity: .5; pointer-events: none; }
.spin { display: inline-block; }
.spin.active { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Main ── */
.main { padding: 24px; max-width: 1200px; margin: 0 auto; }

/* ── Loading / Error ── */
.state-box {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; min-height: 200px; color: var(--fg-muted); text-align: center;
}
.state-box .icon { font-size: 32px; }
.state-box .msg { font-size: 14px; }
.state-box .detail { font-size: 12px; color: var(--fg-light); font-family: 'JetBrains Mono', monospace; }
.retry-btn {
  background: var(--accent); color: #fff; border: none; border-radius: 6px;
  padding: 6px 16px; font-size: 13px; cursor: pointer; margin-top: 4px;
}

/* ── Summary ── */
.summary {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 28px;
}
.sum-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.sum-label { font-size: 10px; color: var(--fg-light); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.sum-val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sum-sub { font-size: 10px; color: var(--fg-muted); margin-top: 2px; }

/* ── Timeline ── */
.timeline-section { margin-bottom: 28px; }
.section-label {
  font-size: 11px; font-weight: 600; color: var(--fg-muted);
  text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px;
}
.timeline-scroll { overflow-x: auto; }
.timeline { min-width: 560px; display: flex; flex-direction: column; gap: 5px; }
.tl-header-row {
  display: grid; grid-template-columns: 110px 1fr; gap: 8px;
  margin-bottom: 2px;
}
.tl-months {
  position: relative; height: 16px; font-size: 9px; color: var(--fg-light);
}
.tl-months span { position: absolute; transform: translateX(-50%); letter-spacing: .3px; }
.tl-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; }
.tl-nome {
  font-size: 11px; color: var(--fg-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tl-bar-track { position: relative; height: 18px; }
.tl-bar {
  position: absolute; height: 100%; border-radius: 3px;
  display: flex; align-items: center; padding: 0 5px;
  font-size: 9px; font-weight: 600; color: rgba(255,255,255,.9);
  white-space: nowrap; overflow: hidden; cursor: default;
  transition: opacity .15s;
}
.tl-bar:hover { opacity: .8; }
.tl-today {
  position: absolute; top: -4px; bottom: -4px; width: 1px;
  background: var(--green); pointer-events: none;
}
.tl-today::before {
  content: 'hoje';
  position: absolute; top: -14px; left: 50%;
  transform: translateX(-50%);
  font-size: 8px; font-weight: 600;
  color: var(--green); letter-spacing: .3px;
}
.tl-ruler-row {
  display: grid; grid-template-columns: 110px 1fr; gap: 8px; margin-top: 2px;
}
.tl-ruler { position: relative; height: 1px; background: var(--border); }

/* ── Vaga sections ── */
.vaga-section { margin-bottom: 28px; }
.vaga-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
}
.vaga-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600; letter-spacing: .5px;
  padding: 3px 10px; border-radius: 20px; color: #fff;
}
.vaga-title { font-size: 13px; font-weight: 600; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .5px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }

/* ── Card ── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 10px;
  position: relative; overflow: hidden;
  transition: box-shadow .2s;
}
.card:hover { box-shadow: var(--shadow-md); }
.card-stripe {
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.card.ativo   { border-color: var(--green); }
.card.atestado { border-color: var(--purple); background: var(--purple-light); }

.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card-nome { font-size: 13px; font-weight: 600; line-height: 1.3; }
.badge {
  font-size: 10px; font-weight: 600; letter-spacing: .3px;
  padding: 2px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
}
.badge-ativo    { background: var(--green-light);  color: var(--green);  border: 1px solid var(--green); }
.badge-futuro   { background: var(--bg-section);   color: var(--fg-muted); border: 1px solid var(--border); }
.badge-retornou { background: var(--bg-section);   color: var(--fg-light); border: 1px solid var(--border); }
.badge-atestado { background: var(--purple-light); color: var(--purple); border: 1px solid var(--purple); }

.bh-row { display: flex; align-items: center; justify-content: space-between; }
.bh-label { font-size: 10px; color: var(--fg-light); text-transform: uppercase; letter-spacing: .4px; }
.bh-val { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }

.prog-bg { background: var(--bg-section); border-radius: 3px; height: 4px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 3px; }

.datas { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.dt-item { display: flex; flex-direction: column; gap: 2px; }
.dt-label { font-size: 9px; color: var(--fg-light); text-transform: uppercase; letter-spacing: .4px; }
.dt-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; font-weight: 500;
  color: var(--fg-muted); font-variant-numeric: tabular-nums;
}
.dt-val.accent  { color: var(--accent); }
.dt-val.green   { color: var(--green); }
.dt-val.purple  { color: var(--purple); }

.dias-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dias-label { font-size: 10px; color: var(--fg-light); text-transform: uppercase; letter-spacing: .4px; }
.dias-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; }

.bh-3col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.bh3-item { display: flex; flex-direction: column; gap: 2px; }
.bh3-label { font-size: 9px; color: var(--fg-light); text-transform: uppercase; letter-spacing: .4px; }
.bh3-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }

.card-obs {
  font-size: 11px; color: var(--fg-muted); line-height: 1.4;
  border-top: 1px solid var(--border); padding-top: 8px;
}

/* ── Last update ── */
.last-update {
  text-align: center; font-size: 11px; color: var(--fg-light);
  padding: 16px 0 32px;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div class="header-logo">🧊</div>
    <div>
      <div class="header-title">Banco de Horas</div>
      <div class="header-sub">Amazon Indústria de Gelo · Manaus</div>
    </div>
  </div>
  <div class="header-right">
    <span class="header-date" id="hdr-date"></span>
    <button class="refresh-btn" id="refresh-btn" onclick="loadData()">
      <span class="spin" id="spin-icon">↻</span> Atualizar
    </button>
    <button class="theme-btn" id="theme-btn">🌙</button>
  </div>
</div>

<div class="main">
  <div id="app">
    <div class="state-box">
      <div class="icon">⏳</div>
      <div class="msg">Carregando dados…</div>
    </div>
  </div>
  <div class="last-update" id="last-update"></div>
</div>

<script>
const SUPABASE_URL = 'https://wziprddrflgpzankofad.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6aXByZGRyZmxncHphbmtvZmFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NDMyNjMsImV4cCI6MjA5NDExOTI2M30.hWrdRYH6M6Voii8uo3MmJB8BKNZOOWRhjls7DFg4pcs';

const TODAY = new Date();
TODAY.setHours(0,0,0,0);

const VAGA_LABEL = { M1:'Motorista 1', M2:'Motorista 2', A1:'Ajudante 1', A2:'Ajudante 2' };
const VAGA_COLOR = { M1:'#3d8bff', M2:'#06b6d4', A1:'#84cc16', A2:'#f97316' };
const VAGA_ORDER = ['M1','M2','A1','A2'];

function parseDate(s) {
  if (!s) return null;
  const [y,m,d] = s.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setHours(0,0,0,0);
  return dt;
}
function fmtShort(s) {
  if (!s) return '—';
  const [,m,d] = s.split('-');
  return `${d}/${m}`;
}
function bhToMin(s) {
  if (!s) return 0;
  const [h,m] = s.split(':').map(Number);
  return h*60 + m;
}
function minToBh(min) {
  const h = Math.floor(min/60);
  const m = min%60;
  return `${h}:${String(m).padStart(2,'0')}`;
}
function getDias(bh) { return Math.floor(bhToMin(bh) / 528); }

// Feriados do ciclo (YYYY-MM-DD)
const FERIADOS = new Set(['2026-10-24','2026-11-02','2026-11-15','2026-11-20','2026-12-08','2026-12-25']);

const FC_MAP = { 'seg':1, 'ter':2, 'qua':3, 'qui':4, 'sex':5, 'sab':6, 'dom':0 };

function isBhDay(date, fcDow) {
  const dow = date.getDay();
  if (dow === 0) return false; // domingo DSR
  if (fcDow !== null && dow === fcDow) return false; // FC
  const key = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  if (FERIADOS.has(key)) return false;
  return true;
}

function calcBhProgress(item) {
  const ini = parseDate(item.dt_inicio);
  const ult = parseDate(item.dt_ultimo);
  if (!ini || !ult) return { consumido: 0, restante: bhToMin(item.horas_banco), totalDias: getDias(item.horas_banco), diasFeitos: 0 };

  const fcDow = item.fc_dia_semana ? (FC_MAP[item.fc_dia_semana] ?? null) : null;
  const totalMin = bhToMin(item.horas_banco);
  const totalDias = getDias(item.horas_banco);

  // Conta dias BH já feitos (de ini até min(hoje-1, ult))
  const limite = new Date(Math.min(TODAY.getTime(), ult.getTime()));
  let diasFeitos = 0;
  const cur = new Date(ini);
  while (cur <= limite) {
    if (isBhDay(cur, fcDow)) diasFeitos++;
    cur.setDate(cur.getDate() + 1);
  }

  const consumido = diasFeitos * 528;
  const restante  = Math.max(0, totalMin - consumido);
  return { consumido, restante, totalDias, diasFeitos };
}

function getStatus(item) {
  const ini = parseDate(item.dt_inicio);
  const ret = parseDate(item.dt_retorno);
  if (!ini || !ret) return 'futuro';
  const isAtestado = item.obs && item.obs.toUpperCase().includes('ATESTADO');
  if (isAtestado && TODAY >= ini) return 'atestado';
  if (TODAY >= ini && TODAY < ret) return 'ativo';
  if (TODAY >= ret) return 'retornou';
  return 'futuro';
}

function formatToday() {
  const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return `${dias[TODAY.getDay()]} ${String(TODAY.getDate()).padStart(2,'0')} ${meses[TODAY.getMonth()]} ${TODAY.getFullYear()}`;
}

async function loadData() {
  const btn = document.getElementById('refresh-btn');
  const spin = document.getElementById('spin-icon');
  btn.classList.add('loading');
  spin.classList.add('active');

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/bh_colaboradores?select=*&order=vaga,dt_inicio`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderApp(data);
    const now = new Date();
    document.getElementById('last-update').textContent =
      `Atualizado em ${now.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'})}`;
  } catch(e) {
    document.getElementById('app').innerHTML = `
      <div class="state-box">
        <div class="icon">⚠️</div>
        <div class="msg">Erro ao carregar dados</div>
        <div class="detail">${e.message}</div>
        <button class="retry-btn" onclick="loadData()">Tentar novamente</button>
      </div>`;
  } finally {
    btn.classList.remove('loading');
    spin.classList.remove('active');
  }
}

function renderApp(data) {
  const app = document.getElementById('app');
  const ativos    = data.filter(d => getStatus(d) === 'ativo').length;
  const futuros   = data.filter(d => getStatus(d) === 'futuro').length;
  const retornam  = data.filter(d => getStatus(d) === 'retornou').length;
  const totalMin  = data.reduce((s,d) => s + bhToMin(d.horas_banco), 0);

  // Summary
  const sumHTML = `
    <div class="summary">
      <div class="sum-card">
        <div class="sum-label">Em Folga Hoje</div>
        <div class="sum-val" style="color:var(--green)">${ativos}</div>
        <div class="sum-sub">colaboradores</div>
      </div>
      <div class="sum-card">
        <div class="sum-label">Aguardando</div>
        <div class="sum-val" style="color:var(--accent)">${futuros}</div>
        <div class="sum-sub">a iniciar</div>
      </div>
      <div class="sum-card">
        <div class="sum-label">Retornaram</div>
        <div class="sum-val" style="color:var(--fg-muted)">${retornam}</div>
        <div class="sum-sub">neste ciclo</div>
      </div>
      <div class="sum-card">
        <div class="sum-label">Total BH</div>
        <div class="sum-val" style="color:var(--amber);font-family:'JetBrains Mono',monospace;font-size:16px">${minToBh(totalMin)}</div>
        <div class="sum-sub">horas no banco</div>
      </div>
    </div>`;

  // Timeline
  const TL_START = new Date(2026,10,1); TL_START.setHours(0,0,0,0);
  const TL_END   = new Date(2026,11,15); TL_END.setHours(0,0,0,0);
  const totalMs  = TL_END - TL_START;
  function pct(d) { return Math.max(0, Math.min(100, (d - TL_START) / totalMs * 100)); }

  const todayPct = pct(TODAY);
  const tlRows = data
    .filter(d => d.dt_inicio && d.dt_ultimo && !( d.obs && d.obs.toUpperCase().includes('ATESTADO') ))
    .map(item => {
      const ini  = parseDate(item.dt_inicio);
      const ult  = parseDate(item.dt_ultimo);
      const left = pct(ini);
      const width= pct(new Date(ult.getTime() + 86400000)) - left;
      const col  = VAGA_COLOR[item.vaga] || '#888';
      const st   = getStatus(item);
      const opacity = st === 'retornou' ? .4 : st === 'futuro' ? .65 : 1;
      const nome = item.nome.split(' ')[0];
      return `
        <div class="tl-row">
          <div class="tl-nome" title="${item.nome}">${item.nome.split(' ').slice(0,2).join(' ')}</div>
          <div class="tl-bar-track">
            <div class="tl-bar" style="left:${left}%;width:${Math.max(width,1)}%;background:${col};opacity:${opacity}"
                 title="${item.nome}: ${fmtShort(item.dt_inicio)} → ${fmtShort(item.dt_ultimo)}">${width > 7 ? nome : ''}</div>
          </div>
        </div>`;
    }).join('');

  const tlHTML = `
    <div class="timeline-section">
      <div class="section-label">Escala Visual — Nov a Dez/2026</div>
      <div class="timeline-scroll">
        <div class="timeline">
          <div class="tl-header-row">
            <div></div>
            <div class="tl-months">
              <span style="left:${pct(new Date(2026,10,1))}%">Nov</span>
              <span style="left:${pct(new Date(2026,11,1))}%">Dez</span>
              <span style="left:${pct(new Date(2026,11,15))}%">15/12</span>
              <span style="left:${todayPct}%;color:var(--green);font-weight:600">hoje</span>
            </div>
          </div>
          ${tlRows}
          <div class="tl-ruler-row">
            <div></div>
            <div class="tl-ruler">
              <div class="tl-today" style="left:${todayPct}%"></div>
            </div>
          </div>
        </div>
      </div>
    </div>`;

  // Cards por vaga
  const vagasHTML = VAGA_ORDER.map(vaga => {
    const items = data.filter(d => d.vaga === vaga);
    if (!items.length) return '';
    const col = VAGA_COLOR[vaga];

    const cardsHTML = items.map(item => {
      const st = getStatus(item);
      const { consumido, restante, totalDias, diasFeitos } = calcBhProgress(item);
      const totalMin = bhToMin(item.horas_banco);
      const progPct = totalMin > 0 ? Math.min(100, consumido / totalMin * 100) : 0;
      const progCol = st === 'atestado' ? 'var(--purple)' : st === 'retornou' ? 'var(--fg-light)' : col;
      const stLabel = { ativo:'EM FOLGA', futuro:'AGUARDANDO', retornou:'RETORNOU', atestado:'ATESTADO' }[st];
      const retClass = st === 'ativo' ? 'green' : st === 'atestado' ? 'purple' : 'accent';
      const diasRestantes = totalDias - diasFeitos;

      const bhProgressHTML = st === 'futuro' ? `
          <div class="bh-row">
            <span class="bh-label">Saldo Inicial</span>
            <span class="bh-val" style="color:${col}">${item.horas_banco || '—'}</span>
          </div>
          <div class="prog-bg"><div class="prog-fill" style="width:0%;background:${col}"></div></div>` : `
          <div class="bh-3col">
            <div class="bh3-item">
              <span class="bh3-label">Saldo Inicial</span>
              <span class="bh3-val" style="color:var(--fg-muted)">${item.horas_banco || '—'}</span>
            </div>
            <div class="bh3-item">
              <span class="bh3-label">Consumido</span>
              <span class="bh3-val" style="color:${progCol}">${minToBh(consumido)}</span>
            </div>
            <div class="bh3-item">
              <span class="bh3-label">Restante</span>
              <span class="bh3-val" style="color:${st==='retornou'?'var(--fg-light)':col}">${minToBh(restante)}</span>
            </div>
          </div>
          <div class="prog-bg" title="${diasFeitos}d feitos de ${totalDias}d">
            <div class="prog-fill" style="width:${progPct}%;background:${progCol}"></div>
          </div>`;

      return `
        <div class="card ${st}">
          <div class="card-stripe" style="background:${col}"></div>
          <div class="card-top">
            <div class="card-nome">${item.nome}</div>
            <span class="badge badge-${st}">${stLabel}</span>
          </div>
          ${bhProgressHTML}
          <div class="datas">
            <div class="dt-item">
              <span class="dt-label">Início</span>
              <span class="dt-val">${fmtShort(item.dt_inicio)}</span>
            </div>
            <div class="dt-item">
              <span class="dt-label">Último</span>
              <span class="dt-val">${fmtShort(item.dt_ultimo)}</span>
            </div>
            <div class="dt-item">
              <span class="dt-label">Retorno</span>
              <span class="dt-val ${retClass}">${fmtShort(item.dt_retorno)}</span>
            </div>
          </div>
          <div class="dias-row">
            <span class="dias-label">Dias feitos</span>
            <span class="dias-val" style="color:${progCol}">${diasFeitos}d</span>
            <span class="dias-label" style="margin-left:8px">Restam</span>
            <span class="dias-val" style="color:${st==='retornou'?'var(--fg-light)':col}">${diasRestantes}d</span>
          </div>
          ${item.obs ? `<div class="card-obs">${item.obs}</div>` : ''}
        </div>`;
    }).join('');

    return `
      <div class="vaga-section">
        <div class="vaga-header">
          <span class="vaga-pill" style="background:${col};${vaga==='A1'||vaga==='M2'?'color:#0f1117':'color:#fff'}">${vaga}</span>
          <span class="vaga-title">${VAGA_LABEL[vaga]}</span>
        </div>
        <div class="cards">${cardsHTML}</div>
      </div>`;
  }).join('');

  app.innerHTML = sumHTML + tlHTML + vagasHTML;
}

// Theme
function setupTheme() {
  const btn = document.getElementById('theme-btn');
  let saved;
  try { saved = localStorage.getItem('bh-theme'); } catch(e){}
  if (saved) { document.documentElement.setAttribute('data-theme', saved); btn.textContent = saved === 'dark' ? '☀️' : '🌙'; }
  btn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    btn.textContent = next === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem('bh-theme', next); } catch(e){}
  });
}

document.getElementById('hdr-date').textContent = formatToday();
setupTheme();
loadData();
</script>
</body>
</html>
